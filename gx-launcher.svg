<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" viewBox="0 0 1280 800"
     preserveAspectRatio="none">
  <title>GX-Launcher</title>
  <desc>SVG wrapper that displays the official GX-Launcher website.</desc>
  <rect width="1280" height="800" fill="#101014"/>
  <foreignObject x="0" y="0" width="1280" height="800">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml"
               style="width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#101014;">
      <xhtml:iframe
        src="https://gx-launcher.github.io/"
        title="GX-Launcher"
        allow="fullscreen; autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
        style="display:block;width:100%;height:100%;border:0;background:#101014;"
      />
    </xhtml:div>
  </foreignObject>
</svg>
